version: '3.8'

services:
  vault:
    image: hashicorp/vault:1.15
    container_name: pam-vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - ./config:/vault/config
      - ./policies:/vault/policies
      - ./logs:/var/log
    command: ["server", "-dev"]

  # JumpServer / Teleport session recording gateway container (Phase 5)
  jumpserver-redis:
    image: redis:7-alpine
    container_name: pam-jumpserver-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  jumpserver-mysql:
    image: mysql:8.0
    container_name: pam-jumpserver-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "LabMySQLPassword2026!"
      MYSQL_DATABASE: "jumpserver"
    ports:
      - "3306:3306"
